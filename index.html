<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Invoice Generator</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<style>
:root{--bg:#f4f4f2;--panel:#fff;--text:#1d1d1b;--muted:#6b6b66;--line:#dcdcd6;--accent:#f0a030;--accent-ink:#2a1a00;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1a1a18;--panel:#262624;--text:#eeeeea;--muted:#9a9a94;--line:#3a3a36}}
:root[data-theme="dark"]{--bg:#1a1a18;--panel:#262624;--text:#eeeeea;--muted:#9a9a94;--line:#3a3a36}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
.app{display:grid;grid-template-columns:minmax(300px,400px) 1fr;gap:20px;padding:20px;max-width:1300px;margin:0 auto}
@media(max-width:900px){.app{grid-template-columns:1fr}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
.panel h2{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 12px}
label{display:block;font-size:12px;color:var(--muted);margin:10px 0 3px}
label:first-of-type{margin-top:0}
input,textarea{width:100%;font:inherit;color:var(--text);background:transparent;border:1px solid var(--line);border-radius:8px;padding:8px 10px}
input:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px}
textarea{resize:vertical;min-height:64px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.item{border:1px solid var(--line);border-radius:8px;padding:8px;margin-bottom:8px;display:grid;grid-template-columns:1fr 1fr 32px;gap:6px}
.item .full{grid-column:1/-1}
.item button{padding:0}
.chk{display:flex;gap:8px;align-items:center;margin-top:12px;font-size:13px;color:var(--text)}
.chk input{width:auto}
select{width:100%;font:inherit;color:var(--text);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--text);padding:8px 12px}
button:hover{border-color:var(--accent)}
.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600;width:100%;padding:12px}
.primary[disabled]{opacity:.6;cursor:wait}
.row-btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.bar{margin:0 0 14px}
.sec[hidden]{display:none}
.msg{font-size:12px;color:var(--muted);margin-top:8px;min-height:16px}
.previewwrap{overflow:hidden}
#scaler{transform-origin:top left}
/* invoice sheet - always light */
.sheet{width:794px;min-height:1120px;background:#fff;color:#111;padding:48px 56px 56px;font-family:Inter,"Helvetica Neue",Arial,sans-serif;font-size:12px;display:flex;flex-direction:column;box-shadow:0 2px 14px rgba(0,0,0,.18)}
.sheet .top{display:flex;justify-content:space-between;align-items:flex-start;gap:20px}
.sheet .nm{font-size:19px;line-height:22px;max-width:230px;font-weight:500;margin-left:auto}
.sheet .ttl{font-size:46px;line-height:46px;font-weight:500;letter-spacing:-.02em;text-align:left;text-transform:uppercase}
.sheet .co{text-align:right}
.sheet .meta{display:grid;grid-template-columns:1fr 1fr;gap:0 28px;margin-top:40px;align-items:start}
.sheet .strip{display:flex;justify-content:space-between;gap:20px;color:#999;font-size:11px;line-height:18px;min-height:18px;margin-bottom:30px}
.sheet .strip span{white-space:nowrap}
.sheet .strip b{font-weight:400;color:#b4b4ae;margin-right:6px}
.sheet .sl{font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#111;padding-bottom:6px;margin-bottom:8px;border-bottom:1px solid #c9c9c4}
.sheet .kv{display:grid;grid-template-columns:58px 1fr;line-height:22px;font-size:11px}
.sheet .kv span:last-child{color:#555;white-space:pre-line}
.sheet .refn{font-weight:600;font-size:13px;text-align:right;line-height:22px;word-break:break-word}
.sheet h2{font-size:25px;font-weight:400;margin:64px 0 20px;letter-spacing:-.01em}
.sheet .rule{border-top:1px solid #c9c9c4}
.sheet .items{padding:0 0 10px}
.sheet .it{display:grid;grid-template-columns:calc(50% + 14px) 1fr 90px 100px;line-height:22px;padding:0;font-size:11px}
.sheet .it .r{text-align:right}
.sheet .mu{color:#555}
.sheet .tw{display:flex;justify-content:space-between;align-items:flex-start;margin-top:12px;gap:20px}
.sheet .calc{color:#555;font-size:11px;line-height:20px;padding-top:6px}
.sheet .tb{margin-left:auto;min-width:270px}
.sheet .tr{display:flex;justify-content:flex-end;gap:24px;line-height:22px;padding:0;font-size:11px}
.sheet .tr span:first-child{text-align:right}
.sheet .tr span:last-child{width:100px;text-align:right;font-variant-numeric:tabular-nums}
.sheet .tr.big{font-weight:600}
.sheet .mo{font-variant-numeric:tabular-nums}
.sheet .tr.due{padding-top:12px;margin-top:6px;border-top:1px solid #c9c9c4}
.sheet .foot{margin-top:auto;padding-top:40px}
.sheet .cols{display:grid;grid-template-columns:1fr 1fr;gap:0 28px}
.sheet h3{font-size:20px;font-weight:400;margin:0 0 14px;letter-spacing:-.01em}
.sheet .bk{display:grid;grid-template-columns:58px 1fr;line-height:22px;font-size:11px}
.sheet .bk span:last-child{white-space:pre-line;color:#555}
.sheet .terms{font-size:11px;line-height:22px;color:#555;white-space:pre-line}
</style>
</head>
<body>
<div class="app">
  <div>
    <div class="panel">
      <h2>Presets</h2>
      <label>Saved presets</label>
      <div class="two"><select id="preset"></select><div class="row-btns" style="margin:0"><button type="button" id="loadPreset">Load</button><button type="button" id="delPreset">Delete</button></div></div>
      <label>Save current setup as</label>
      <div class="two"><input id="presetName" placeholder="e.g. Hourly tuition"><button type="button" id="savePreset">Save preset</button></div>
      <div class="msg" id="pmsg" style="margin-top:6px"></div>
    </div>
    <div class="bar">
      <label>Edit section</label>
      <select id="sec"><option value="header">Header</option><option value="contact">Contact</option><option value="billto">Bill to</option><option value="description">Description</option><option value="bank">Bank details</option><option value="tax">Tax</option></select>
    </div>
    <div class="panel sec" data-sec="header">
      <h2>Header</h2>
      <div class="two"><div><label>Date (top left)</label><input type="date" data-k="date"></div><div><label>Reference (top right)</label><input data-k="ref"></div></div>
      <label>Title</label><input data-k="title">
      <label>Your name / company (top right)</label><input data-k="name">
    </div>
    <div class="panel sec" data-sec="contact">
      <h2>Contact</h2>
      <label>Email</label><input data-k="email">
      <label>Phone</label><input data-k="phone">
      <label>Address</label><textarea data-k="addr"></textarea>
    </div>
    <div class="panel sec" data-sec="billto">
      <h2>Bill to</h2>
      <label>Name</label><input data-k="to">
      <label>Address</label><textarea data-k="toAddr"></textarea>
      <label>Attn</label><input data-k="attn">
    </div>
    <div class="panel sec" data-sec="description">
      <h2>Description</h2>
      <label>Description line</label><input data-k="desc">
      <label>Line items</label>
      <div id="items"></div>
      <div class="row-btns"><button type="button" id="addItem">+ Add line</button><button type="button" id="dupItem">Duplicate last line</button></div>
      <label>Currency symbol</label><input data-k="cur">
      <div class="two"><div><label>Tax label</label><input data-k="taxLabel"></div><div><label>Tax rate (%)</label><input type="number" step="any" min="0" data-k="taxRate"></div></div>
      <label class="chk"><input type="checkbox" id="showAmt"> Show rate on every line</label>
      <label>Due date (optional)</label><input type="date" data-k="due">
    </div>
    <div class="panel sec" data-sec="bank">
      <h2>Bank details</h2>
      <label>Heading</label><input data-k="payHead">
      <label>Name</label><input data-k="payName">
      <div class="two"><div><label>Acct no</label><input data-k="acct"></div><div><label>Sort code</label><input data-k="sort"></div></div>
      <label>Bank</label><textarea data-k="bank"></textarea>
    </div>
    <div class="panel sec" data-sec="tax">
      <h2>Tax</h2>
      <label>Heading</label><input data-k="msgHead">
      <label>UTR</label><input data-k="utr">
      <label>Note</label><textarea data-k="message"></textarea>
      <label>Additional note (optional)</label><textarea data-k="foot"></textarea>
    </div>
    <button class="primary" id="dl" type="button">Download PDF</button>
    <div class="msg" id="msg"></div>
    <button type="button" id="copyLink" style="width:100%;margin-top:6px">Copy prefill link</button>
    <input id="linkOut" readonly hidden style="margin-top:8px;font-size:12px">
  </div>
  <div class="previewwrap" id="pw"><div id="scaler"><div class="sheet" id="sheet"></div></div></div>
</div>
<script>
(function(){
var KEY="invoiceGenV1";
var TODAY=(function(){var d=new Date();return d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2)})();
var def={title:"INVOICE",ref:"",name:"",addr:"",phone:"",email:"",utr:"",msgHead:"Tax",message:"",
to:"",toAddr:"",attn:"",date:TODAY,desc:"",cur:"£",totLabel:"Total",taxLabel:"Tax",taxRate:"0",due:"",showAmt:false,
items:[{l:"",q:"",r:""}],
payHead:"Bank Details",payName:"",acct:"",sort:"",bank:"",foot:""};
var S=JSON.parse(JSON.stringify(def));
try{var raw=localStorage.getItem(KEY)||localStorage.getItem("invoiceGenV1");if(raw){var p=JSON.parse(raw);for(var k in p)S[k]=p[k];
 S.items=S.items.map(function(i){var q=i.q==null?"":String(i.q).trim(),u=i.u!=null?String(i.u).trim():(p.unit||"");if(q!==""&&u&&q.indexOf(u)<0)q=q+" "+u;return{l:i.l,q:q,r:i.r!=null?String(i.r):String(p.rate!=null?p.rate:"")}});}}catch(e){}
if(S.payHead==="PLEASE MAKE PAYMENT DIRECT INTO")S.payHead="Bank Details";
if(S.msgHead==="MESSAGE"||S.msgHead==="Terms")S.msgHead="Tax";
if(S.totLabel==="TOTAL")S.totLabel="Total";
S.date=def.date;
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function money(n){return n.toLocaleString("en-GB",{minimumFractionDigits:2,maximumFractionDigits:2})}
function num(v){var n=parseFloat(v);return isNaN(n)?0:n}
function qn(i){var t=String(i.q).trim();if(t==="")return 1;var n=parseFloat(t);return isNaN(n)?1:n}
function amtOf(i){return qn(i)*num(i.r)}
function fmtDate(iso){var m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(iso||"");return m?m[3]+"/"+m[2]+"/"+m[1]:(iso||"")}
function rateTxt(i){return money(num(i.r))}
function totals(){
 var a=0;S.items.forEach(function(i){a+=amtOf(i)});
 var tax=a*num(S.taxRate)/100;
 return{a:a,tax:tax,g:a+tax};
}
function html(){
 var t=totals(),cur=esc(S.cur),sa=S.showAmt;
 function m(n){return cur+money(n)}
 function kv(k,v){return String(v||"").trim()?'<div class="kv"><span>'+k+'</span><span>'+esc(v)+'</span></div>':''}
 var rows=S.items.map(function(i){
  var hasQ=String(i.q).trim()!=="";
  return '<div class="it"><div>'+esc(i.l)+'</div><div class="mu">'+esc(i.q)+'</div><div class="mu mo r">'+(sa&&hasQ&&qn(i)!==1&&String(i.r).trim()!==""?esc(rateTxt(i)):'')+'</div><div class="r mo">'+m(amtOf(i))+'</div></div>'}).join("");
  var taxOn=num(S.taxRate)>0;
 var tb=(taxOn?'<div class="tr"><span>Subtotal</span><span>'+m(t.a)+'</span></div><div class="tr"><span>'+esc(S.taxLabel||"Tax")+' ('+esc(num(S.taxRate))+'%)</span><span>'+m(t.tax)+'</span></div>':'')+
  '<div class="tr big"><span>'+m(t.g)+'</span></div>'+
  (S.due?'<div class="tr due"><span>Due Date</span><span>'+esc(fmtDate(S.due))+'</span></div>':'');
 var terms=[S.message,S.foot].filter(function(x){return String(x||"").trim()}).join("\n\n");
 return '<div class="strip"><span>'+(S.date?'<b>Date</b>'+esc(fmtDate(S.date)):'')+'</span><span>'+(String(S.ref||"").trim()?'<b>Ref</b>'+esc(S.ref):'')+'</span></div><div class="top"><div class="ttl">'+esc(S.title)+'</div><div class="co">'+'<div class="nm">'+esc(S.name)+'</div></div></div>'+
 '<div class="meta"><div><div class="sl">Contact</div>'+kv('Email',S.email)+kv('Phone',S.phone)+kv('Address',S.addr)+'</div>'+
 '<div><div class="sl">Bill to</div>'+kv('Name',S.to)+kv('Address',S.toAddr)+kv('Attn',S.attn)+'</div></div>'+
 '<div class="sl" style="margin-top:40px">Description</div>'+
 '<div class="items">'+(S.desc?'<div class="it"><div>'+esc(S.desc)+'</div><div></div><div></div><div></div></div>':'')+rows+'</div><div class="rule"></div>'+
 '<div class="tw"><div class="tb">'+tb+'</div></div>'+
 '<div class="foot"><div class="cols"><div><div class="sl">'+esc(S.payHead)+'</div>'+
 '<div class="bk"><span>Name</span><span>'+esc(S.payName)+'</span></div>'+
 '<div class="bk"><span>Acct no</span><span>'+esc(S.acct)+'</span></div>'+
 '<div class="bk"><span>Sort code</span><span>'+esc(S.sort)+'</span></div>'+
 '<div class="bk"><span>Bank</span><span>'+esc(S.bank)+'</span></div></div>'+
 '<div><div class="sl">'+esc(S.msgHead)+'</div>'+(String(S.utr||"").trim()?'<div class="bk"><span>UTR</span><span>'+esc(S.utr)+'</span></div>':'')+'<div class="terms">'+esc(terms)+'</div></div></div></div>';
}
var sheet=document.getElementById("sheet");
function fit(){
 var pw=document.getElementById("pw"),sc=document.getElementById("scaler"),w=pw.clientWidth,s=Math.min(1,w/794);
 sc.style.transform="scale("+s+")";pw.style.height=(sheet.offsetHeight*s)+"px";
}
function render(){
 sheet.innerHTML=html();
 fit();
}
function buildItems(){
 var box=document.getElementById("items");box.innerHTML="";
 S.items.forEach(function(it,idx){
  var d=document.createElement("div");d.className="item";
  function mk(key,ph,cls,type){var e=document.createElement("input");if(type){e.type=type;e.step="any"}e.value=it[key];e.placeholder=ph;if(cls)e.className=cls;
   e.oninput=function(){it[key]=e.value;save();render()};return e}
  var x=document.createElement("button");x.type="button";x.textContent="\u00d7";x.title="Remove line";
  x.onclick=function(){S.items.splice(idx,1);save();buildItems();render()};
  var l=mk("l","Description or date","full");
  d.appendChild(l);
  d.appendChild(mk("q","Qty, e.g. 4 hrs or 2 tracks"));d.appendChild(mk("r","Rate / amount","","number"));d.appendChild(x);
  box.appendChild(d);
 });
}
var showAmt=document.getElementById("showAmt");showAmt.checked=!!S.showAmt;
showAmt.onchange=function(){S.showAmt=showAmt.checked;save();render()};
var PKEY="invoiceGenPresets",PF=["title","desc","cur","taxLabel","taxRate","showAmt","msgHead","message","foot","items"];
function loadPs(){try{var r=JSON.parse(localStorage.getItem(PKEY)||"{}");return r&&typeof r==="object"?r:{}}catch(e){return{}}}
function savePs(o){try{localStorage.setItem(PKEY,JSON.stringify(o));return true}catch(e){return false}}
var psel=document.getElementById("preset"),pname=document.getElementById("presetName"),pmsg=document.getElementById("pmsg");
function fillPs(sel){
 var o=loadPs(),names=Object.keys(o);psel.innerHTML="";
 if(!names.length){var e=document.createElement("option");e.value="";e.textContent="No saved presets";psel.appendChild(e);return}
 names.forEach(function(n){var e=document.createElement("option");e.value=n;e.textContent=n;psel.appendChild(e)});
 if(sel&&o[sel])psel.value=sel;
}
document.getElementById("savePreset").onclick=function(){
 var n=pname.value.trim();if(!n){pmsg.textContent="Give the preset a name first.";return}
 var o=loadPs(),d={};PF.forEach(function(k){d[k]=JSON.parse(JSON.stringify(S[k]))});o[n]=d;
 if(savePs(o)){pmsg.textContent="Saved “"+n+"”.";pname.value="";fillPs(n)}else pmsg.textContent="Could not save presets in this browser.";
};
document.getElementById("loadPreset").onclick=function(){
 var o=loadPs(),d=o[psel.value];if(!d)return;
 PF.forEach(function(k){if(d[k]!==undefined)S[k]=JSON.parse(JSON.stringify(d[k]))});save();
 document.querySelectorAll("[data-k]").forEach(function(el){el.value=S[el.getAttribute("data-k")]});
 showAmt.checked=!!S.showAmt;buildItems();render();pmsg.textContent="Loaded “"+psel.value+"”.";
};
document.getElementById("delPreset").onclick=function(){
 var o=loadPs(),n=psel.value;if(!o[n])return;delete o[n];savePs(o);fillPs();pmsg.textContent="Deleted “"+n+"”.";
};
fillPs();
document.querySelectorAll("[data-k]").forEach(function(el){
 var k=el.getAttribute("data-k");el.value=S[k];
 el.addEventListener("input",function(){S[k]=el.value;save();render()});
});
document.getElementById("addItem").onclick=function(){S.items.push({l:"",q:"",r:""});save();buildItems();render()};
document.getElementById("dupItem").onclick=function(){var last=S.items[S.items.length-1];if(!last)return;S.items.push({l:last.l,q:last.q,r:last.r});save();buildItems();render()};
var msg=document.getElementById("msg");
document.getElementById("dl").onclick=async function(){
 var btn=this;btn.disabled=true;msg.textContent="Building PDF...";
 var holder=document.createElement("div");
 holder.style.cssText="position:fixed;left:-10000px;top:0;width:794px";
 var clone=document.createElement("div");clone.className="sheet";clone.style.boxShadow="none";clone.innerHTML=html();
 holder.appendChild(clone);document.body.appendChild(holder);
 var name=(S.ref||"invoice").replace(/[^\w]+/g,"-").replace(/^-+|-+$/g,"")||"invoice";
 try{
  if(document.fonts&&document.fonts.ready)await document.fonts.ready;
  var blob=await html2pdf().set({margin:0,image:{type:"jpeg",quality:.98},html2canvas:{scale:2,useCORS:true,scrollX:0,scrollY:0},pagebreak:{mode:["css","legacy"],avoid:[".it",".tr",".bk",".kv"]},jsPDF:{unit:"px",format:[794,1123],orientation:"portrait",hotfixes:["px_scaling"]}}).from(clone).outputPdf("blob");
  var dls=null;try{dls=await claude.use("downloads")}catch(e){}
  if(dls){await dls.save({filename:name+".pdf",data:blob});msg.textContent="Saved."}
  else{var a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name+".pdf";document.body.appendChild(a);a.click();a.remove();msg.textContent="Download started."}
 }catch(err){msg.textContent=(err&&err.code==="declined")?"Cancelled.":"Could not save the PDF ("+((err&&err.message)||err)+")."}
 finally{holder.remove();btn.disabled=false}
};
var secSel=document.getElementById("sec"),SK="invoiceGenSec";
function showSec(v){document.querySelectorAll(".sec").forEach(function(pn){pn.hidden=pn.getAttribute("data-sec")!==v})}
try{var sv=localStorage.getItem(SK);if(sv&&secSel.querySelector('option[value="'+sv+'"]'))secSel.value=sv}catch(e){}
showSec(secSel.value);
secSel.onchange=function(){showSec(secSel.value);try{localStorage.setItem(SK,secSel.value)}catch(e){}};
function clean(v){return String(v==null?"":v).replace(/[|;]/g,",")}
function buildHash(){
 var q=new URLSearchParams();
 var m={date:S.date,ref:S.ref,title:S.title,name:S.name,email:S.email,phone:S.phone,addr:S.addr,to:S.to,toaddr:S.toAddr,attn:S.attn,desc:S.desc,cur:S.cur,taxlabel:S.taxLabel,taxrate:S.taxRate,due:S.due,payhead:S.payHead,payname:S.payName,acct:S.acct,sort:S.sort,bank:S.bank,taxhead:S.msgHead,utr:S.utr,taxnote:S.message,foot:S.foot};
 Object.keys(m).forEach(function(k){if(String(m[k]||"").trim()!=="")q.set(k,m[k])});
 if(S.showAmt)q.set("rate","1");
 q.set("items",S.items.map(function(i){return [clean(i.l),clean(i.q),clean(i.r)].join("|")}).join(";"));
 return q.toString();
}
function applyHash(){
 var h=location.hash.replace(/^#/,"");if(!h)return;
 var q;try{q=new URLSearchParams(h)}catch(e){return}
 var map={date:"date",ref:"ref",title:"title",name:"name",email:"email",phone:"phone",addr:"addr",to:"to",toaddr:"toAddr",attn:"attn",desc:"desc",cur:"cur",taxlabel:"taxLabel",taxrate:"taxRate",due:"due",payhead:"payHead",payname:"payName",acct:"acct",sort:"sort",bank:"bank",taxhead:"msgHead",utr:"utr",taxnote:"message",foot:"foot"};
 var any=false;
 Object.keys(map).forEach(function(k){if(q.has(k)){S[map[k]]=q.get(k).replace(/\\n/g,"\n");any=true}});
 if(q.has("rate")){S.showAmt=q.get("rate")==="1";any=true}
 if(q.has("items")){
  var its=q.get("items").split(";").map(function(r){var f=r.split("|");return{l:(f[0]||"").trim(),q:(f[1]||"").trim(),r:(f[2]||"").trim()}}).filter(function(i){return i.l||i.q||i.r});
  if(its.length){S.items=its;any=true}
 }
